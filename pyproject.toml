[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopentest"
version = "1.0.0"
description = "AI-powered CLI penetration testing tool"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "groq>=0.4",
    "httpx[http2]>=0.25",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "keyring>=24.0",
    "diskcache>=5.6",
    "scikit-learn>=1.3",
    "reportlab>=4.0",
    "networkx>=3.0",
    "googlesearch-python>=1.2",
    "beautifulsoup4>=4.12",
    "numpy>=1.24",
    "boto3>=1.28",
    "requests>=2.31",
    "aiofiles>=23.0",
]

[project.scripts]
autopentest = "autopentest.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
